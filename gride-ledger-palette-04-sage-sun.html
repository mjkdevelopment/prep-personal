<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gride Ledger Palette 04</title>
  <style>
    :root { --bg:#f3f3e7; --surface:#fefdf9; --text:#21261d; --muted:#687063; --primary:#50664f; --secondary:#8ea16e; --accent:#edc85e; --signal:#d98658; }
    body{margin:0;background:linear-gradient(180deg,#fafaf2,var(--bg));font-family:ui-sans-serif,system-ui,sans-serif;color:var(--text)}*{box-sizing:border-box}.page{max-width:1040px;margin:0 auto;padding:44px 28px 70px}
    .banner{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;border-radius:34px;padding:34px;box-shadow:0 22px 50px rgba(80,102,79,.16)}h1{font-size:58px;line-height:1;margin:10px 0 12px}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:24px}.card{background:var(--surface);border-radius:24px;padding:22px;box-shadow:0 14px 36px rgba(33,38,29,.08)}.tone{height:92px;border-radius:18px}.small{margin-top:10px;color:var(--muted);font-size:13px}
  </style>
</head>
<body>
  <main class="page">
    <section class="banner">
      <div style="font-size:12px;letter-spacing:.22em;text-transform:uppercase;opacity:.8">Palette 04</div>
      <h1>Sage & Sun</h1>
      <p style="max-width:620px;line-height:1.6;color:rgba(255,255,255,.84)">Mas amable y cotidiana. Buena si quieres que la app se sienta menos densa y mas respirable, manteniendo un lujo suave.</p>
    </section>
    <section class="grid">
      <article class="card"><div class="tone" style="background:#50664f"></div><div class="small">Primary sage</div></article>
      <article class="card"><div class="tone" style="background:#8ea16e"></div><div class="small">Secondary sage</div></article>
      <article class="card"><div class="tone" style="background:#edc85e"></div><div class="small">Sun accent</div></article>
      <article class="card"><div class="tone" style="background:#d98658"></div><div class="small">Warm alert</div></article>
    </section>
  </main>
</body>
</html>
