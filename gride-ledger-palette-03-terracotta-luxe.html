<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gride Ledger Palette 03</title>
  <style>
    :root { --bg:#fbf1eb; --surface:#fffaf6; --text:#2a1e1a; --muted:#80685f; --primary:#6e3d31; --secondary:#ba6c55; --accent:#d8b067; --signal:#355f5f; }
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at top left,#fffdfb,var(--bg));font-family:"Iowan Old Style",Georgia,serif;color:var(--text)}
    .page{max-width:1060px;margin:0 auto;padding:42px 28px 68px}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px}.card{background:var(--surface);border-radius:28px;padding:28px;box-shadow:0 18px 48px rgba(110,61,49,.1)}
    h1{font-size:62px;line-height:.94;margin:10px 0 16px}.lead{font-family:ui-sans-serif,system-ui,sans-serif;line-height:1.6;color:var(--muted)}.hero-main{background:linear-gradient(160deg,var(--primary),var(--secondary));color:#fff}
    .palette{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}.tone{height:110px;border-radius:22px}.meta{font:700 12px ui-sans-serif,system-ui,sans-serif;color:var(--muted);margin-top:8px}
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <article class="card hero-main">
        <div style="letter-spacing:.18em;text-transform:uppercase;font-size:12px;opacity:.76">Palette 03</div>
        <h1>Terracotta Luxe</h1>
        <p class="lead" style="color:rgba(255,255,255,.82)">Mas humana y calida. Hace que la app se vea premium con personalidad latina y menos corporativa.</p>
      </article>
      <article class="card">
        <strong>Buena si quieres algo mas vivo y distintivo.</strong>
        <div class="palette">
          <div><div class="tone" style="background:#6e3d31"></div><div class="meta">Cacao</div></div>
          <div><div class="tone" style="background:#ba6c55"></div><div class="meta">Terracotta</div></div>
          <div><div class="tone" style="background:#d8b067"></div><div class="meta">Gold Sand</div></div>
          <div><div class="tone" style="background:#355f5f"></div><div class="meta">Deep Teal</div></div>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
