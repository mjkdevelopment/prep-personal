<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gride Ledger Palette 05</title>
  <style>
    :root { --bg:#f4f0f6; --surface:#fffdfd; --text:#241d2b; --muted:#6f6676; --primary:#46385d; --secondary:#7b6d98; --accent:#d8b06a; --signal:#47908b; }
    *{box-sizing:border-box}body{margin:0;font-family:"Neue Haas Grotesk Text",ui-sans-serif,system-ui,sans-serif;background:radial-gradient(circle at top right,#fff,var(--bg));color:var(--text)}
    .page{max-width:1080px;margin:0 auto;padding:42px 28px 72px}.hero{display:flex;gap:24px}.card{flex:1;background:var(--surface);border-radius:30px;padding:28px;box-shadow:0 18px 46px rgba(70,56,93,.12)}.hero-main{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff}
    h1{font-size:60px;line-height:.96;margin:12px 0}.sub{line-height:1.55;color:rgba(255,255,255,.84)}.stack{display:grid;gap:14px;margin-top:18px}.sw{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}.dot{width:18px;height:18px;border-radius:999px}
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <article class="card hero-main">
        <div style="font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.8">Palette 05</div>
        <h1>Plum Finance</h1>
        <p class="sub">Una opcion mas fashion y contemporanea. Tiene personalidad, pero sigue siendo contenida si se usa sobre fondos claros.</p>
      </article>
      <article class="card">
        <strong>Buena si quieres un look premium mas moderno.</strong>
        <div class="stack">
          <div class="sw"><span class="dot" style="background:#46385d"></span>Primary plum</div>
          <div class="sw"><span class="dot" style="background:#7b6d98"></span>Secondary lavender slate</div>
          <div class="sw"><span class="dot" style="background:#d8b06a"></span>Accent brass</div>
          <div class="sw"><span class="dot" style="background:#47908b"></span>Signal teal</div>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
